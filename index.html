<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>喝水提醒 💧</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #00c6fb 50%, #005bea 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    overflow: hidden;
    position: relative;
  }
  .bubbles {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  }
  .bubbles span {
    position: absolute; bottom: -80px;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.18);
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0) scale(1); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(-110vh) scale(1.4); opacity: 0; }
  }
  .card {
    position: relative; z-index: 1;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 24px;
    padding: 48px 56px;
    max-width: 480px; width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .drop { font-size: 72px; line-height: 1; margin-bottom: 8px; animation: bob 2.8s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-10px);} }
  h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; letter-spacing: 1px; }
  .sub { opacity: 0.85; font-size: 14px; margin-bottom: 28px; }
  .timer {
    font-variant-numeric: tabular-nums;
    font-size: 64px; font-weight: 300;
    margin: 12px 0 8px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
  }
  .label { font-size: 13px; opacity: 0.75; margin-bottom: 24px; }
  .stats {
    display: flex; justify-content: space-around;
    background: rgba(0,0,0,0.12); border-radius: 14px;
    padding: 14px; margin-bottom: 24px;
  }
  .stat b { display:block; font-size: 22px; font-weight: 600; }
  .stat span { font-size: 12px; opacity: 0.75; }
  .buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    border: none; cursor: pointer;
    padding: 12px 22px; border-radius: 999px;
    font-size: 14px; font-weight: 500;
    background: rgba(255,255,255,0.9); color: #0a66c2;
    transition: transform .15s, background .2s;
  }
  button:hover { transform: translateY(-2px); }
  button.ghost { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.4); }
  .hint { margin-top: 18px; font-size: 12px; opacity: 0.7; line-height: 1.6; }

  .card { transition: transform 6s ease-in-out, opacity 4s ease; }
  body.antiburn {
    background: #000 !important;
    transition: background 3s ease;
  }
  body.antiburn .bubbles { opacity: 0.15; transition: opacity 3s; }
  body.antiburn .card {
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border-color: transparent;
    box-shadow: none;
    opacity: 0.55;
  }
  body.antiburn .stats,
  body.antiburn .buttons,
  body.antiburn .sub,
  body.antiburn .hint,
  body.antiburn .label { opacity: 0; pointer-events: none; transition: opacity 2s; }
  body.antiburn .drop { font-size: 40px; animation: none; }
  body.antiburn h1 { font-size: 14px; opacity: 0.5; margin: 0; }
  body.antiburn .timer { font-size: 36px; opacity: 0.7; margin: 6px 0 0; }
  .antiburn-exit {
    position: fixed; inset: 0; z-index: 20;
    display: none; background: transparent; cursor: pointer;
  }
  body.antiburn .antiburn-exit { display: block; }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(0, 30, 60, 0.85);
    display: none; align-items: center; justify-content: center;
    animation: fadeIn .3s ease;
  }
  .overlay.show { display: flex; }
  @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
  .alertBox {
    background: linear-gradient(135deg,#48c6ef,#6f86d6);
    border-radius: 24px; padding: 48px 56px; text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    animation: pop .4s cubic-bezier(.2,1.3,.4,1);
  }
  @keyframes pop { from {transform: scale(.7); opacity:0;} to {transform: scale(1); opacity:1;} }
  .alertBox .drop { font-size: 96px; }
  .alertBox h2 { font-size: 32px; margin: 8px 0 6px; }
  .alertBox p { opacity: 0.9; margin-bottom: 24px; }
</style>
</head>
<body>
  <div class="bubbles" id="bubbles"></div>
  <div class="antiburn-exit" id="antiburnExit" title="点击退出防烧屏模式"></div>

  <div class="card">
    <div class="drop">💧</div>
    <h1>喝水提醒</h1>
    <div class="sub">每 5 分钟提醒你喝一口水,保持水润</div>

    <div class="timer" id="timer">05:00</div>
    <div class="label">距离下次提醒</div>

    <div class="stats">
      <div class="stat"><b id="count">0</b><span>已提醒次数</span></div>
      <div class="stat"><b id="elapsed">0</b><span>运行分钟</span></div>
    </div>

    <div class="buttons">
      <button id="btnStart">开始提醒</button>
      <button id="btnPause" class="ghost">暂停</button>
      <button id="btnReset" class="ghost">重置</button>
    </div>

    <div class="hint">
      首次点击「开始提醒」会请求通知权限,保持此页面打开即可。<br/>
      提醒触发时会弹窗 + 响铃 + 系统通知。<br/>
      <span id="wakeStatus">🔓 屏幕常亮:未开启</span><br/>
      🛡️ 运行后 10 秒无操作会自动进入「防烧屏模式」（元素缓慢飘移，避免像素烧入），点击屏幕恢复。
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="alertBox">
      <div class="drop">🥤</div>
      <h2>该喝水啦!</h2>
      <p>起来动一动,喝一大口水吧 ~</p>
      <button id="btnOk">好的,我去喝水 ✓</button>
    </div>
  </div>

<script>
  const INTERVAL = 5 * 60;
  let remaining = INTERVAL;
  let ticking = null;
  let count = 0;
  let startedAt = null;
  let wakeLock = null;
  let idleTimer = null;
  let antiburnShiftTimer = null;
  const IDLE_MS = 10 * 1000;

  const $timer = document.getElementById('timer');
  const $count = document.getElementById('count');
  const $elapsed = document.getElementById('elapsed');
  const $overlay = document.getElementById('overlay');
  const $btnStart = document.getElementById('btnStart');
  const $btnPause = document.getElementById('btnPause');
  const $btnReset = document.getElementById('btnReset');
  const $btnOk = document.getElementById('btnOk');
  const $wakeStatus = document.getElementById('wakeStatus');

  function fmt(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const x = (s % 60).toString().padStart(2, '0');
    return `${m}:${x}`;
  }
  function render() {
    $timer.textContent = fmt(remaining);
    $count.textContent = count;
    $elapsed.textContent = startedAt
      ? Math.floor((Date.now() - startedAt) / 60000)
      : 0;
    document.title = ticking ? `${fmt(remaining)} · 喝水提醒` : '喝水提醒 💧';
  }

  let audioCtx = null;
  function beep() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      [0, 0.25, 0.5].forEach(delay => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now + delay);
        gain.gain.setValueAtTime(0, now + delay);
        gain.gain.linearRampToValueAtTime(0.25, now + delay + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.2);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + delay);
        osc.stop(now + delay + 0.25);
      });
    } catch(e) {}
  }

  function notify() {
    count++;
    beep();
    $overlay.classList.add('show');
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('💧 该喝水啦!', {
        body: '起来动一动,喝一大口水吧~',
        silent: false
      });
    }
    render();
  }

  function tick() {
    remaining--;
    if (remaining <= 0) {
      remaining = INTERVAL;
      notify();
    }
    render();
  }

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) {
      $wakeStatus.textContent = '⚠️ 屏幕常亮:当前浏览器不支持(请用 Chrome/Edge/Safari 最新版,且页面需通过 https 或 localhost 打开)';
      return;
    }
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      $wakeStatus.textContent = '🔒 屏幕常亮:已开启';
      wakeLock.addEventListener('release', () => {
        $wakeStatus.textContent = '🔓 屏幕常亮:已释放';
      });
    } catch (err) {
      $wakeStatus.textContent = '⚠️ 屏幕常亮:申请失败(' + err.message + ')';
    }
  }
  async function releaseWakeLock() {
    if (wakeLock) { try { await wakeLock.release(); } catch(e){} wakeLock = null; }
    $wakeStatus.textContent = '🔓 屏幕常亮:未开启';
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && ticking && !wakeLock) {
      requestWakeLock();
    }
  });

  function start() {
    if (ticking) return;
    if (!startedAt) startedAt = Date.now();
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
    try { (audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)()).resume(); } catch(e){}
    requestWakeLock();
    resetIdleTimer();
    ticking = setInterval(tick, 1000);
    $btnStart.textContent = '运行中…';
    render();
  }
  function pause() {
    if (ticking) { clearInterval(ticking); ticking = null; }
    releaseWakeLock();
    clearTimeout(idleTimer);
    exitAntiBurn();
    $btnStart.textContent = '继续';
    render();
  }
  function reset() {
    pause();
    remaining = INTERVAL;
    count = 0;
    startedAt = null;
    $btnStart.textContent = '开始提醒';
    render();
  }

  $btnStart.addEventListener('click', start);
  $btnPause.addEventListener('click', pause);
  $btnReset.addEventListener('click', reset);
  $btnOk.addEventListener('click', () => $overlay.classList.remove('show'));

  const $card = document.querySelector('.card');
  function shiftCard() {
    const dx = (Math.random() - 0.5) * 120;
    const dy = (Math.random() - 0.5) * 160;
    $card.style.transform = `translate(${dx}px, ${dy}px)`;
  }
  function enterAntiBurn() {
    if (document.body.classList.contains('antiburn')) return;
    document.body.classList.add('antiburn');
    shiftCard();
    antiburnShiftTimer = setInterval(shiftCard, 15000);
  }
  function exitAntiBurn() {
    if (!document.body.classList.contains('antiburn')) { resetIdleTimer(); return; }
    document.body.classList.remove('antiburn');
    $card.style.transform = '';
    clearInterval(antiburnShiftTimer); antiburnShiftTimer = null;
    resetIdleTimer();
  }
  function resetIdleTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (ticking) enterAntiBurn(); }, IDLE_MS);
  }
  ['pointerdown','touchstart','keydown','mousemove'].forEach(ev =>
    window.addEventListener(ev, () => {
      if (document.body.classList.contains('antiburn')) exitAntiBurn();
      else resetIdleTimer();
    }, { passive: true })
  );
  document.getElementById('antiburnExit').addEventListener('click', exitAntiBurn);

  (function createBubbles() {
    const wrap = document.getElementById('bubbles');
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('span');
      const size = 10 + Math.random() * 40;
      s.style.width = s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.animationDuration = (6 + Math.random() * 10) + 's';
      s.style.animationDelay = (-Math.random() * 10) + 's';
      wrap.appendChild(s);
    }
  })();

  render();
</script>
</body>
</html>
